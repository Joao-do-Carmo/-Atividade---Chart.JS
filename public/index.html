<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade ChartJS</title>
    <link rel="icon" href="assets/icon/favicon2.png">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<div class="caixa">
    <div class="titulo">
        <h1>Análise de Temperatura e Umidade</h1>
    </div>
    <!-- grafico de linhas -->
    <h2>Gráfico de Linhas — Variação Horária (Temperatura x Umidade):</h2>
    <div class="chart-linha">
        <canvas id="myChart"></canvas>
    </div>
    <!-- graficos de barras -->
    <h2>Gráfico de Barras — Médias Mensais:</h2>
    <div class="chart-barras">
        <div class="barra">
            <canvas id="myChart2"></canvas>
        </div>
        <div class="barra">
            <canvas id="myChart3"></canvas>
        </div>
    </div>
</div>
</body>
</html>
<!-- GRAFICO TEMPERATURA E UMIDADE EM LINHA -->
<script>
    // setup
    const labels = [
        '12:00',
        '13:00',
        '14:00',
        '15:00',
        '16:00',
        '17:00',
    ];

    const data = {
        labels: labels,
        datasets: [{
            label: 'Temperatura (°C)',
            backgroundColor: 'rgb(0, 255, 255, 0.6)',
            borderColor: 'rgb(0, 255, 255)',
            data: [30, 29, 28, 25, 22, 23],
        },
        {
            label: 'Umidade (%)',
            backgroundColor: 'rgb(0, 0, 255, 0.6)',
            borderColor: 'rgb(0, 0, 255)',
            data: [80, 82, 80, 85, 80, 83],
        }]
    };
    // configurações
    const config = {
        type: 'line',
        data: data,
        options: {}
    };
</script>
<!-- GRAFICO TEMPERATURA EM BARRA -->
<script>
    // setup
    const labels2 = [
        'Janeiro',
        'Fevereiro',
        'Março',
        'Abril',
        'Maio',
        'Junho'
    ];

    const data2 = {
        labels: labels2,
        datasets: [
            {
                label: 'Temperatura Média (°C)',
                data: [22, 24, 27, 23, 20, 18],
                backgroundColor: 'rgba(0, 255, 255, 0.6)',
                borderColor: 'rgb(0, 255, 255)',
                borderWidth: 1
            }
        ]
    };
    // configurações
    const config2 = {
        type: 'bar',
        data: data2,
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    };
</script>
<!-- GRAFICO UMIDADE EM BARRA -->
<script>
    // setup
    const labels3 = [
        'Janeiro',
        'Fevereiro',
        'Março',
        'Abril',
        'Maio',
        'Junho'
    ];

    const data3 = {
        labels: labels3,
        datasets: [
            {
                label: 'Umidade Média (%)',
                data: [90, 89, 93, 87, 88, 82],
                backgroundColor: 'rgba(0, 0, 255, 0.6)',
                borderColor: 'rgb(0, 0, 255)',
                borderWidth: 1
            }
        ]
    };
    // configurações
    const config3 = {
        type: 'bar',
        data: data3,
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    };
</script>
<!-- RENDERIZAÇÃO DOS GRAFICOS NA INTERFACE -->
<script>
    const myChart = new Chart(
        document.getElementById('myChart'),
        config
    );

    const myChart2 = new Chart(
        document.getElementById('myChart2'),
        config2
    );

    const myChart3 = new Chart(
        document.getElementById('myChart3'),
        config3
    );
</script>
